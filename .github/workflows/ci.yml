name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,gui]"
      - run: python -m ruff check .
      - run: python -m mypy src/sifter
      - run: python -m pytest --cov=sifter --cov-report=term-missing --cov-fail-under=90
      - run: python -m build
