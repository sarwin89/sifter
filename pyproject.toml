[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sifter"
version = "0.1.0"
description = "Fourier-assisted inference for one-dimensional spectral peak models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "BSD-3-Clause"
authors = [{name = "Sarwin Deon Chandran"}]
dependencies = [
    "numpy>=1.26,<2.5",
    "scipy>=1.12,<1.18",
    "pandas>=2.2",
    "plotly>=5.20",
]

[project.optional-dependencies]
gui = ["pillow>=10", "streamlit>=1.32"]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "pillow>=10",
    "ruff>=0.6",
    "scipy-stubs>=1.17,<1.18",
    "streamlit>=1.32",
]

[project.scripts]
sifter-gui = "sifter.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sifter"]

[tool.hatch.build.targets.wheel.force-include]
"app/streamlit_app.py" = "sifter/_streamlit_app.py"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sifter"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "plotly", "plotly.*"]
ignore_missing_imports = true
